name: docs-gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install PyYAML (gate dependency)
        run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Gate self-test (RED fixture -> GREEN, offline)
        run: python3 tools/test_docs_gate.py
      - name: Documentation gate (coverage + provenance + stale-pin)
        run: python3 tools/docs_gate.py --root .
      - name: Upload gate report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-report
          path: tools/gate-report.json
          retention-days: 7
